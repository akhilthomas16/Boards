# Shared definitions. `docker compose up` also reads docker-compose.override.yml (development).
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
name: hash_out

services:
  # ─── Infrastructure ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boards_db}
      POSTGRES_USER: ${POSTGRES_USER:-boards_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boards_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boards_user} -d ${POSTGRES_DB:-boards_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ─── Backend ────────────────────────────────────────────
  # Admin only — `docker compose --profile admin up django`. The app itself doesn't need it.
  django:
    profiles: ["admin"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-boards_user}:${POSTGRES_PASSWORD:-boards_pass}@postgres:5432/${POSTGRES_DB:-boards_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - media_data:/app/media
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-boards_user}:${POSTGRES_PASSWORD:-boards_pass}@postgres:5432/${POSTGRES_DB:-boards_db}
      - REDIS_URL=redis://redis:6379/0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  # ─── Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Next inlines NEXT_PUBLIC_* at build time, so it is a build arg, not just an env var.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      - API_INTERNAL_URL=http://fastapi:8001  # server-side: the /media rewrite runs in this container
    depends_on:
      fastapi:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
