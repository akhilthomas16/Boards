# Docker Compose — PostgreSQL, Redis, Django admin, FastAPI, Next.js
name: hash_out

services:
  # ─── Infrastructure ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boards_db
      POSTGRES_USER: boards_user
      POSTGRES_PASSWORD: boards_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boards_user -d boards_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ─── Backend ────────────────────────────────────────────
  # Admin only — `docker compose --profile admin up django`. The app itself doesn't need it.
  django:
    profiles: ["admin"]
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_data:/app/media
    env_file: .env
    environment:
      - DATABASE_URL=postgres://boards_user:boards_pass@postgres:5432/boards_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - media_data:/app/media
    env_file: .env
    environment:
      - DATABASE_URL=postgres://boards_user:boards_pass@postgres:5432/boards_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  # ─── Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - API_INTERNAL_URL=http://fastapi:8001  # server-side: the /media rewrite runs inside this container
    depends_on:
      - fastapi

volumes:
  postgres_data:
  redis_data:
  media_data:
